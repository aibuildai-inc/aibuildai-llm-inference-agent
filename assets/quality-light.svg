<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" width="1120" height="340" role="img" aria-label="Paired accuracy: GSM8K 92.20 percent with and without the head, 5 items changed each way; HumanEval 80.49 percent both, 2 each way; McNemar p equals 1.000.">
<rect width="1120" height="340" fill="#fcfcfb"/>
<text x="40" y="44" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="17" font-weight="600" fill="#0b0b0b">Accuracy is unchanged, and the disagreements are symmetric</text>
<text x="40" y="66" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="12.5" fill="#898781">Same 664 problems answered with the head and without it &#183; greedy &#183; paired per item</text>
<rect x="40" y="82" width="10" height="10" rx="2" fill="#e34948"/>
<text x="56" y="91" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="12" fill="#52514e">head wrong, no-head right</text>
<rect x="232" y="82" width="10" height="10" rx="2" fill="#3987e5"/>
<text x="248" y="91" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="12" fill="#52514e">head right, no-head wrong</text>
<line x1="660" y1="104" x2="660" y2="218" stroke="#c3c2b7" stroke-width="1"/>
<text x="412" y="136" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="13" fill="#898781" text-anchor="end"><tspan font-size="13" font-weight="600" fill="#0b0b0b">GSM8K</tspan>  92.20% both arms &#183; n=500</text>
<path d="M659 118 H433 a4 4 0 0 0 -4 4 V140 a4 4 0 0 0 4 4 H659 Z" fill="#e34948"/>
<path d="M661 118 H887 a4 4 0 0 1 4 4 V140 a4 4 0 0 1 -4 4 H661 Z" fill="#3987e5"/>
<text x="419" y="136" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="end">5</text>
<text x="901" y="136" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="12.5" font-weight="600" fill="#0b0b0b">5</text>
<text x="925" y="136" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="12" fill="#898781">changed, each way</text>
<text x="412" y="196" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="13" fill="#898781" text-anchor="end"><tspan font-size="13" font-weight="600" fill="#0b0b0b">HumanEval</tspan>  80.49% both arms &#183; n=164</text>
<path d="M659 178 H571 a4 4 0 0 0 -4 4 V200 a4 4 0 0 0 4 4 H659 Z" fill="#e34948"/>
<path d="M661 178 H749 a4 4 0 0 1 4 4 V200 a4 4 0 0 1 -4 4 H661 Z" fill="#3987e5"/>
<text x="557" y="196" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="end">2</text>
<text x="763" y="196" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="12.5" font-weight="600" fill="#0b0b0b">2</text>
<text x="787" y="196" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="12" fill="#898781">changed, each way</text>
<text x="40" y="298" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="12.5" fill="#52514e">Combined 7 : 7 over 664 problems &#183; McNemar exact p = 1.000</text>
<text x="40" y="320" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="11.5" fill="#898781">No detectable difference at this sample size, which is not the same as none: resolving one point at p&lt;0.05 needs about 800 items per arm.</text>
</svg>
