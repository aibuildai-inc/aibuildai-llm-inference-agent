<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" width="1120" height="400" role="img" aria-label="Decoding throughput: HF eager 16.8, vLLM 52.1, SGLang 52.2, AIBuildAI runs 87.6, 100.1 and 104.9 tokens per second">
