<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 250" width="1120" height="250" role="img" aria-label="Paired accuracy: GSM8K 92.20 percent for both AIBuildAI and SGLang, 5 items changed each way; HumanEval 80.49 percent both, 2 each way; McNemar p equals 1.000.">
