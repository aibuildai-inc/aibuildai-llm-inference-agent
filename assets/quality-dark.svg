<text x="40" y="66" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="12.5" fill="#898781">Same 664 problems answered by AIBuildAI and by SGLang &#183; greedy &#183; paired per item</text>
