<text x="40" y="382" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="11.5" fill="#898781">Blue: heads this agent built, one bar per run. The SGLang and vLLM bars each run that framework's own n-gram speculation; the multiplier is against the SGLang bar. The two earlier runs were timed in another session, so only their tok/s is comparable here.</text>
