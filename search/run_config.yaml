# aibuildai config -- AUTO-GENERATED, do not hand-edit this file.
#
# GENERATED from the Pydantic config models in config.py (the single source of
# truth for defaults AND per-option docs). To change a default/comment or add/
# remove an option, edit config.py and regenerate:
#   `python -m startup.example_yaml`.
#
# To configure a run, copy this file and edit your COPY's values, then:
#   aibuildai run <your copy>
# Lines marked `REQUIRED -- replace` have no default and must be supplied.

# Inputs and the manager-generated identity for one run.
run:
  # short task id (names the output dir)
  # REQUIRED -- replace
  task_name: specdec-sglang
  # optional host conda environment cloned into this run's Program environment before Setup; cloning needs conda initialized in the launching shell. A missing base creates a fresh Python 3.11 environment with the product's own tooling, no conda needed; unset means look for an environment named by run.task_name
  conda_env: sglang-baseline
  # the user's task folder: the whole run input. It holds what the task asks for in any readable form plus every material the task needs. Setup reads it, freezes it as the run's README, and writes the run's score program; it is read-only for the whole run
  # REQUIRED -- replace
  data_root: __REPO__/search/task
  # when true, SETUP prepares the task itself: the task statement comes from run.task_prompt and the task folder ships no data, so SETUP follows its llm.system_instructions to obtain the data + evaluation spec, carve a held-out answer key, and author the score program + README from scratch. Default false: the task folder holds the statement and the data, and SETUP only wraps them
  setup_from_scratch: false
  # the task statement for a setup_from_scratch run: what to solve, in the user's own words (e.g. the competition to enter). SETUP copies it verbatim into the run's README, so every later role reads exactly this text. REQUIRED when run.setup_from_scratch is true and REJECTED when it is false -- with setup_from_scratch false the statement lives in the run.data_root task folder instead
  task_prompt:
  # writable run-output root
  # REQUIRED -- replace
  playground_root: __PLAYGROUND__
  # The run's budget: the whole-pipeline global budget (wall-clock + USD) plus the per-agent governance knobs (cost cap / reminder cadence / finalize threshold). Owned by `run` because a run IS a concern; the budget never forms its own top-level concept.
  budget:
    # minutes before the run stops starting new exploration work (1440 = 24h)
    # work already running and final delivery can continue, so the result can arrive later
    # > 0
    wall_clock_minutes: 2880
    # soft run-level USD admission gate over every exploration agent's own spend; null = no limit
    # > 0
    cost_usd: 250
    # USD cap on one agent's own spend; null = no limit
    # > 0
    per_agent_cost_cap_usd: 50
# Per-role LLM reasoning profiles: which model each role runs on and how it reasons. ``default`` is the base profile (the router itself runs on it, and every role cascades its unset fields from it); ``by_role`` are per-role overrides; ``auto`` opts into the subagent router. A bare string ``llm: X`` is sugar for ``{default: {model: X}}``.

#     ``profile_for(role)`` resolves a role's complete profile with precedence User(``by_role``) > Router(``auto``) > ``default``, cascading field by field.
llm:
  # A role's COMPLETE reasoning profile: which MODEL it runs on plus the model-coupled reasoning knobs (``effort`` / ``max_thinking_tokens``). You never pick a model without owning its reasoning depth, so both live in one profile. ``llm.default`` is such a profile; ``llm.by_role`` entries are partial :class:`RoleModelProfileOverride` profiles that cascade onto it.
  # the base reasoning profile: model (required) plus reasoning knobs. The router itself runs on this model, and every role cascades its unset fields from here.
  default:
    # model id this role runs on (bare deepseek-* targets DeepSeek; bare gpt-* targets OpenAI; provider/model = OpenRouter; else Anthropic)
    # REQUIRED -- replace
    model: claude-opus-4-8
    # reasoning-effort knob. null = unset (no --effort flag, the binary default applies); set low/medium/high/xhigh/max to steer reasoning depth.
    effort:
    # null lets the model choose thinking depth, guided by effort; 0 disables extended thinking; a positive value sets the budget
    # >= 0
    max_thinking_tokens:

  # per-role profile overrides, keyed by role ('coder', 'designer', ...). Each entry is a PARTIAL profile (any subset of model/effort/max_thinking_tokens); unset fields cascade from `default` (and the router's model pick). Empty = every role uses `default`. Coexists with `auto` as the highest-precedence layer.
  # Example (uncomment + edit):
  #   by_role:
  #     designer: {model: claude-opus-4-8, effort: high}
  #     coder: {model: claude-sonnet-5}
  #     reviser: {effort: medium}
  by_role:
    setup:
      model: claude-sonnet-5

  # opt into the subagent Router with its built-in model-routing skill. Coexists with `by_role`: the router decides each role's MODEL, then a `by_role` override wins field-by-field (User > Router > default).
  # Example (uncomment + edit):
  #   auto:
  #     strategy: llm
  #     mode: stable
  #     per_execution: true
  #     roles: all          # or an exact list such as [designer, coder]
  #     allowed_models:    # null = unrestricted; a list restricts the menu
  #       - claude-haiku-4-5
  #       - claude-sonnet-5
  #       - claude-opus-4-8
  auto:
  # seconds of provider-outage patience before a paused run stops; unset waits forever
  # > 0
  retry_ceiling_s:

  # extra run instructions keyed by agent role; each role receives only the text under its own name
  # Example (uncomment + edit):
  #   setup: |
  #     Install every package the task needs.
  #   designer: |
  #     Use a pretrained model when it fits the task.
  #   worker: |
  #     Load the planned pretrained weights.
  system_instructions:
    setup: "This task measures decoding speed on a GPU, so two of your usual assumptions do not hold.\n1. Scoring is NOT a seconds-long CPU check here. It loads large models and generates text on a\n   GPU, and legitimately takes tens of minutes. Do not try to make it cheap or to skip work.\n2. Scoring runs with NO network. Before you finish, run harness/fetch_models.py so every model\n   named in models.json is in the local cache and loads with local_files_only=True. If you skip\n   this, every scored step of the run will fail.\nWrite private/score.py as a thin wrapper around the task folder's own harness: run harness/gate.py\nfirst, and if its JSON says passed is false return {'score': 0.0}; otherwise run harness/benchmark.py\nand return its 'speedup' as the score. Read the JSON these scripts print; never treat their exit\ncode as the verdict. Pass --device for exactly one GPU. Record method_tokens_per_second,\nbaseline_tokens_per_second, alpha, tau and gate_passed as components.\nInstall torch matching this host's driver, plus transformers, accelerate and huggingface_hub.\nUse example_submission/ as the baseline attempt: it is a complete, working submission.\nThe metric is speedup, and metric_direction is max.\n\nThree rules for score.py, each learned from a run that lost steps to it:\n1. DEVICE. Choose among the VISIBLE devices by free memory, and never by an nvidia-smi index:\n       import torch\n       n = torch.cuda.device_count()\n       idx = max(range(n), key=lambda i: torch.cuda.mem_get_info(i)[0])\n       device = f'cuda:{idx}'\n   Both halves of that matter, and each has already broken a run.\n   * nvidia-smi ignores CUDA_VISIBLE_DEVICES and reports every physical card on the host. When an\n     Action IS pinned to one card it sees exactly one device, so an nvidia-smi index produced\n     '--device cuda:2' in a process that only had cuda:0, and every scored step died.\n   * But not every caller of score.py is pinned. The SETUP verifier runs it with no GPU request,\n     so all cards are visible and cuda:0 is physical GPU 0 - which on a shared host may be full.\n     Hardcoding cuda:0 sent it onto another tenant's card and it OOMed, then sat waiting for\n     memory that was never going to free while an empty card sat beside it.\n   Selecting the emptiest VISIBLE device is correct in both cases: pinned, there is only one to\n   pick; unpinned, you avoid a card someone else owns.\n2. ERRORS MUST SAY WHY. When you shell out, capture stderr and INCLUDE IT in the exception you\n   raise. A bare CalledProcessError reaches the journal as a wall of traceback with no cause,\n   and the run then repeats the same failure with nothing to diagnose it from.\n3. TRANSIENT OOM. This host is shared and another tenant can fill the card after it was\n   allocated. Before loading a model, check free VRAM (torch.cuda.mem_get_info) and wait for\n   what you need, within your wall-clock budget, instead of dying instantly on the first\n   allocation failure. A step lost this way is hours of work thrown away."
    worker: "Read README.md in the task folder before changing anything: its measurement rules are not style\npreferences, they decide whether a number means anything. Never edit models.json, prompts.json or\nanything under harness/ - they are the measuring instrument. Write your own implementation; do not\ncopy code from elsewhere on this machine. Export a complete submission directory every step, even\nan unambitious one: a step that exports nothing is scored as nothing.\n\nYour whole step - reading, editing, training, benchmarking, exporting - must fit in 6 hours, and a\nstep killed at its wall-clock limit loses its training entirely; nothing resumes it. So export a\nloadable artifact early and improve it with the time left, and export a complete submission before\nyou start anything that might not finish. As a rough scale for a target of this size on this class\nof hardware: a modest proposer training is about an hour, a thorough one three to four hours.\n\nTwo things about how this search is scored should change how you spend a step.\n\n1. The score is speed, but speed is a PRODUCT of two factors: how often the proposer is right, and\n   what each verification cycle costs. Tuning the cost half is fast, safe, and runs out. Improving\n   how often the proposer is right usually means TRAINING - slow, and it may not pay back inside\n   one step. Both are legitimate work. Do not let the second go untouched across the whole run\n   merely because the first is easier to bank. Before you choose, measure the decomposition and\n   say which factor your change targets.\n\n2. A step that leaves the score flat, or slightly lower, while MEASURABLY improving the proposer's\n   accuracy is progress, not a failed step - provided you record that accuracy number in your notes\n   and in manifest.json so the next step can build on it. State plainly in your notes which of the\n   two factors you moved, and by how much.\n\nIf your proposer is something you train, treat its training data volume and its capacity as things\nyou may change, not as settled by whichever step introduced it first. Producing more training\nsupervision is usually cheap GPU time next to the step budget.\n\nThis task fixes the TARGET model and leaves the proposer open: models.json has\ndraft: null on purpose. A separate draft model, a trained head over the target's own\nhidden states, retrieval from the context, n-gram lookup - the choice and its\njustification are the work. Measure the cost decomposition before committing to one.\nWhatever you load must be in the local HuggingFace cache when scoring runs: your\nsession has network, the score program does not. Download during your session and\nprove the load with local_files_only=True."
